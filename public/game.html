<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <header>
      <h1 id="heading">Tic Tac Toe</h1>
      <h2 id="room"></h2>
    </header>

    <section id="info">
      <div>
        <h3 id="user"></h3>
        <h3 id="user-symbol"></h3>
        <h3 id="user-id"></h3>
      </div>

      <div>
        <h3 id="opponent"></h3>
        <h3 id="opponent-symbol"></h3>
        <h3 id="opponent-id"></h3>
      </div>
    </section>

    <main>
      <table id="container">
        <tr>
          <td index="0" class="cell"></td>
          <td index="1" class="cell"></td>
          <td index="2" class="cell"></td>
        </tr>
        <tr>
          <td index="3" class="cell"></td>
          <td index="4" class="cell"></td>
          <td index="5" class="cell"></td>
        </tr>
        <tr>
          <td index="6" class="cell"></td>
          <td index="7" class="cell"></td>
          <td index="8" class="cell"></td>
        </tr>
      </table>

      <div id="situation"></div>
    </main>

    <footer>
      <p>© 2026 Tic Tac Toe </p>
    </footer>

    <script src="game.js"></script>
  </body>
</html>
